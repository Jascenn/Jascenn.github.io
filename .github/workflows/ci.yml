name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate feed XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('feed.xml'); print('feed.xml OK')"

      - name: Check internal links
        run: |
          python3 - <<'PY'
          import os, re, sys
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote

          class LinkCollector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ('href', 'src') and value:
                          self.links.append(value)

          missing = []
          checked = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  parser = LinkCollector()
                  parser.feed(open(path, encoding='utf-8').read())
                  base = os.path.dirname(path)
                  for link in parser.links:
                      parsed = urlparse(link)
                      if parsed.scheme in ('http', 'https', 'mailto', 'tel'):
                          continue
                      target = unquote(parsed.path)
                      if not target:
                          continue
                      local = os.path.normpath(os.path.join(base, target))
                      if not os.path.exists(local):
                          missing.append(f'{path}: {link}')
                      checked += 1
          print(f'checked {checked} internal links')
          if missing:
              print('missing targets:')
              for item in missing:
                  print(' ', item)
              sys.exit(1)
          PY

      - name: Check HTML completeness
        run: |
          python3 - <<'PY'
          import os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  text = open(path, encoding='utf-8').read()
                  for marker in ('</html>', '</body>'):
                      if marker not in text.lower():
                          bad.append(f'{path}: missing {marker}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('all HTML files complete')
          PY
